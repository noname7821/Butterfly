name: Build Butterfly deb
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos deps
        run: |
          sudo apt-get update
          sudo apt-get install -y make clang git curl libplist-dev libssl-dev \
            libstdc++-12-dev libncurses-dev zlib1g-dev fakeroot dpkg xz-utils
          
          export THEOS=$HOME/theos
          CI=1 bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          
          if [ ! -x "$HOME/theos/toolchain/linux/iphone/bin/clang" ]; then
            echo "ERROR: Theos toolchain not installed correctly."
            ls -la "$HOME/theos/toolchain/linux/iphone/bin/" || true
            exit 1
          fi
          
          mkdir -p $HOME/theos/sdks
          curl -L -f -o /tmp/sdk.tar.xz \
            "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz"
          tar -xJf /tmp/sdk.tar.xz -C $HOME/theos/sdks
          rm /tmp/sdk.tar.xz

      - name: Build
        run: |
          export THEOS=$HOME/theos
          export PATH=$THEOS/bin:$PATH
          make package FINALPACKAGE=1

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: butterfly-deb
          path: packages/*.deb
